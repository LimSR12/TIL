name: TIL Sync

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_sync:
        description: "전체 .md 파일 동기화"
        type: boolean
        default: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build sync payload
        id: payload
        run: |
          set -eo pipefail

          git config core.quotePath false

          # ── 1. 변경된 .md 파일 목록 수집 ──
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.full_sync }}" == "true" ]]; then
            echo "▶ Full sync mode"
            changed=$(git ls-tree -r --name-only HEAD | grep -E '\.md$' || true)
          else
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.event.after }}"

            if [[ "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
              changed=$(git ls-tree -r --name-only "$AFTER" -- '*.md')
            else
              changed=$(git diff --name-only --diff-filter=AM "$BEFORE" "$AFTER" -- '*.md')
            fi
          fi

          echo "::group::수집된 파일 목록 (필터 전)"
          echo "${changed:-<없음>}"
          echo "::endgroup::"

          # ── 2. 메타 디렉토리 제외 ──
          changed=$(echo "$changed" | grep -v -E '^\.(nosync|github)/' || true)

          echo "::group::필터 후 파일 목록"
          echo "${changed:-<없음>}"
          echo "::endgroup::"

          if [ -z "$changed" ]; then
            echo "⏭ 동기화할 .md 파일 없음 — skip"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ── 3. JSON payload 생성 ──
          echo "$changed" | while IFS= read -r file; do
            [ -z "$file" ] && continue

            if [ ! -f "$file" ]; then
              echo "⚠ 파일 없음, 건너뜀: $file" >&2
              continue
            fi

            # frontmatter 제외 후 실제 본문이 비어있으면 건너뜀
            body=$(sed '/^---$/,/^---$/d' "$file" | tr -d '[:space:]')
            if [ -z "$body" ]; then
              echo "⏭ 본문 없음, 건너뜀: $file" >&2
              continue
            fi

            # frontmatter 필드 추출
            fm_status=$(sed -n '/^---$/,/^---$/{ s/^status:[[:space:]]*//p }' "$file")
            fm_title=$(sed -n '/^---$/,/^---$/{ s/^title:[[:space:]]*//p }' "$file")
            fm_summary=$(sed -n '/^---$/,/^---$/{ s/^summary:[[:space:]]*//p }' "$file")

            # draft이면 건너뜀
            if [ "$fm_status" = "draft" ]; then
              echo "⏭ draft 상태, 건너뜀: $file" >&2
              continue
            fi

            created_at=$(git log --diff-filter=A --follow --format="%aI" -- "$file" | tail -1)
            updated_at=$(git log -1 --format="%aI" -- "$file")
            created_at="${created_at:-$updated_at}"

            jq -n --arg path "$file" \
                  --arg title "$fm_title" \
                  --arg summary "$fm_summary" \
                  --rawfile content "$file" \
                  --arg createdAt "$created_at" \
                  --arg updatedAt "$updated_at" \
              '{ path: $path, title: (if $title == "" then null else $title end), summary: (if $summary == "" then null else $summary end), content: $content, createdAt: $createdAt, updatedAt: $updatedAt }'
          done | jq -s '{ files: . }' > /tmp/sync-payload.json

          file_count=$(jq '.files | length' /tmp/sync-payload.json)
          echo "✅ payload 생성 완료: ${file_count}개 파일"

          if [ "$file_count" -eq 0 ]; then
            echo "⏭ payload에 파일이 0개 — skip"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync to blog server
        if: steps.payload.outputs.skip != 'true'
        run: |
          curl -X POST "${{ secrets.BLOG_API_URL }}/api/v1/til/sync" \
            -H "Content-Type: application/json" \
            -H "X-Sync-Secret: ${{ secrets.TIL_SYNC_SECRET }}" \
            -d @/tmp/sync-payload.json \
            --fail --silent --show-error
