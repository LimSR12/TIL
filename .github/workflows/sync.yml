name: TIL Sync

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_sync:
        description: "전체 .md 파일 동기화"
        type: boolean
        default: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build sync payload
        id: payload
        run: |
          bash .github/scripts/build-sync-payload.sh \
            "${{ github.event_name }}" \
            "${{ inputs.full_sync }}" \
            "${{ github.event.before }}" \
            "${{ github.event.after }}"

      - name: Sync to blog server
        if: steps.payload.outputs.skip != 'true'
        run: |
          curl -X POST "${{ secrets.BLOG_API_URL }}/api/v1/til/sync" \
            -H "Content-Type: application/json" \
            -H "X-Sync-Secret: ${{ secrets.TIL_SYNC_SECRET }}" \
            -d @/tmp/sync-payload.json \
            --fail --silent --show-error
