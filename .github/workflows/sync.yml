name: TIL Sync

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_sync:
        description: "전체 .md 파일 동기화"
        type: boolean
        default: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build sync payload
        id: payload
        run: |
          # 한글 파일명이 escape되지 않도록 설정
          git config core.quotePath false

          # 수동 실행(full_sync) 또는 push 이벤트 분기
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.full_sync }}" == "true" ]]; then
            echo "▶ Full sync mode"
            changed=$(git ls-tree -r HEAD --name-only -- '*.md')
          else
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.event.after }}"

            if [[ "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
              changed=$(git ls-tree -r --name-only "$AFTER" -- '*.md')
            else
              changed=$(git diff --name-only --diff-filter=AM "$BEFORE" "$AFTER" -- '*.md')
            fi
          fi

          if [ -z "$changed" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "$changed" | while IFS= read -r file; do
            [ -z "$file" ] && continue
            created_at=$(git log --diff-filter=A --follow --format="%aI" -- "$file" | tail -1)
            updated_at=$(git log -1 --format="%aI" -- "$file")
            jq -n --arg path "$file" \
                  --rawfile content "$file" \
                  --arg createdAt "$created_at" \
                  --arg updatedAt "$updated_at" \
              '{ path: $path, content: $content, createdAt: $createdAt, updatedAt: $updatedAt }'
          done | jq -s '{ files: . }' > /tmp/sync-payload.json

      - name: Sync to blog server
        if: steps.payload.outputs.skip != 'true'
        run: |
          curl -X POST "${{ secrets.BLOG_API_URL }}/api/til/sync" \
            -H "Content-Type: application/json" \
            -H "X-Sync-Secret: ${{ secrets.TIL_SYNC_SECRET }}" \
            -d @/tmp/sync-payload.json \
            --fail --silent --show-error
